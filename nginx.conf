server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Only profile pictures are made public. The sibling claims directory is not exposed.
    location ^~ /uploads/profile-pictures/ {
        alias /srv/initiative-uploads/profile_pictures/;
        autoindex off;
        add_header Cache-Control "public, max-age=604800";
        add_header X-Content-Type-Options "nosniff";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
