services:
  initiative-frontend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-8080}:80"
    volumes:
      - initiative-uploads:/srv/initiative-uploads:ro

volumes:
  initiative-uploads:
    external: true
    name: initiative-api-prod_initiative_uploads
